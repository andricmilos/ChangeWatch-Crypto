<section class="panel panel-chart">
  <div class="panel-header">
    <h2>Grafikon <span id="chart-symbol" class="chart-symbol">—</span></h2>
    <div class="chart-controls">
      <div class="button-group" role="group" aria-label="Interval">
        <button type="button" class="toggle" data-interval="1m" aria-pressed="true">1m</button>
        <button type="button" class="toggle" data-interval="5m" aria-pressed="false">5m</button>
        <button type="button" class="toggle" data-interval="15m" aria-pressed="false">15m</button>
        <button type="button" class="toggle" data-interval="1h" aria-pressed="false">1h</button>
      </div>
      <div class="button-group" role="group" aria-label="Tip grafikona">
        <button type="button" class="toggle" data-chart-type="candles" aria-pressed="true">Sveće</button>
        <button type="button" class="toggle" data-chart-type="line" aria-pressed="false">Linija</button>
      </div>
      <div class="button-group" role="group" aria-label="Markeri na grafikonu">
        <button type="button" class="toggle" data-marker-kind="notes" aria-pressed="true">Beleške</button>
        <button type="button" class="toggle" data-marker-kind="alerts" aria-pressed="true">Alerti</button>
      </div>
      <button type="button" id="note-add" class="note-button" aria-pressed="false" hidden>
        Dodaj belešku
      </button>
      <button type="button" id="export-candles" class="note-button"
              title="1m sveće trenutnog para za prikazani period" disabled>
        Preuzmi CSV
      </button>
      <button type="button" id="copy-link" class="note-button" aria-live="polite"
              title="Link do ovog para i intervala">
        Kopiraj link
      </button>
    </div>
  </div>
  <p id="export-candles-error" class="note-error" role="alert" hidden></p>
  <div class="chart-wrap">
    <div id="chart"></div>
    <div id="chart-message" class="chart-message" hidden></div>
    <div id="chart-stale" class="chart-stale" role="status" hidden>Podaci nisu aktuelni</div>
  </div>
  <p id="note-pick-hint" class="note-hint" role="status" hidden>
    Klikni na sveću za vreme beleške (Escape za izlaz).
  </p>
  <form id="note-form" class="note-form" hidden>
    <p class="note-form-time">
      <span id="note-form-local"></span>
      <span id="note-form-utc" class="note-muted"></span>
    </p>
    <div class="note-form-row">
      <input id="note-form-text" type="text" autocomplete="off" aria-label="Tekst beleške"
             placeholder="Tekst beleške">
      <span id="note-form-count" class="note-count" aria-live="polite">0/280</span>
      <button type="submit" class="note-button">Sačuvaj</button>
      <button type="button" id="note-form-cancel" class="note-button">Otkaži</button>
    </div>
    <p id="note-form-error" class="note-error" role="alert" hidden></p>
  </form>
  <ul id="chart-notes" class="chart-notes" aria-label="Beleške i alerti za sveću" hidden></ul>
  <p class="chart-note">Vreme je prikazano u UTC. <span class="shortcuts-hint">? – prečice</span></p>
  <div class="notes-panel">
    <div class="export-header">
      <h3>Beleške za <span id="notes-panel-symbol">—</span></h3>
      <button type="button" id="export-notes" class="note-button"
              title="Sve beleške trenutnog para" disabled>
        Preuzmi CSV
      </button>
    </div>
    <p id="export-notes-error" class="note-error" role="alert" hidden></p>
    <p id="notes-panel-error" class="note-error" role="alert" hidden></p>
    <p id="notes-panel-empty" class="note-muted">Nema beleški u prikazanom periodu.</p>
    <ul id="notes-panel-list" class="notes-panel-list"></ul>
  </div>
</section>
